name: Build TWRP Recovery for Yunluo (Android 16 Kernel)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Initialize Build Environment & Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagej lib32ncurses-dev lib32z1-dev libelf-dev libxml2-utils xsltproc zip libssl-dev python3 python-is-python3 p7zip-full cpio lz4

    - name: Install Repo Tool & Magiskboot
      run: |
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

        wget -q https://github.com/HuskyDG/magisk-files/raw/main/magiskboot -O ~/bin/magiskboot
        chmod +x ~/bin/magiskboot

    - name: Sync TWRP Source
      run: |
        mkdir twrp_12.1 && cd twrp_12.1
        git config --global user.name "Builder"
        git config --global user.email "builder@github.com"
        git config --global color.ui false
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1 --depth=1
        repo sync -c -j4 --force-sync --no-clone-bundle --no-tags

    - name: Clone Device Tree
      run: |
        cd twrp_12.1
        git clone https://github.com/xiaomi-mt6789-devs/android_device_xiaomi_yunluo device/xiaomi/yunluo
        git clone https://github.com/xiaomi-mt6789-devs/android_device_xiaomi_yunluo-kernel device/xiaomi/yunluo-kernel

    - name: Extract Modules from LineageOS 23 vendor_boot.img
      run: |
        mkdir -p /tmp/vendor_unpack
        cp vendor_boot.img /tmp/vendor_unpack/
        cd /tmp/vendor_unpack
        
        # Распаковываем vendor_boot и вытягиваем ramdisk
        ~/bin/magiskboot unpack vendor_boot.img
        mkdir -p ramdisk_out
        cd ramdisk_out
        ~/bin/magiskboot cpio ../ramdisk.cpio extract
        
        # Копируем живые модули Android 16 в TWRP
        mkdir -p $GITHUB_WORKSPACE/twrp_12.1/device/xiaomi/yunluo/recovery/root/vendor/lib/modules
        mkdir -p $GITHUB_WORKSPACE/twrp_12.1/device/xiaomi/yunluo/recovery/root/lib/modules
        
        find . -name "*.ko" -exec cp {} $GITHUB_WORKSPACE/twrp_12.1/device/xiaomi/yunluo/recovery/root/vendor/lib/modules/ \;
        find . -name "*.ko" -exec cp {} $GITHUB_WORKSPACE/twrp_12.1/device/xiaomi/yunluo/recovery/root/lib/modules/ \;

    - name: Configure Board & Direct Modprobe Init
      run: |
        cd twrp_12.1/device/xiaomi/yunluo

        # Очистка устаревших SEPolicy
        rm -rf sepolicy

        # Сброс старых флагов
        sed -i '/TW_THEME/d' BoardConfig.mk
        sed -i '/TARGET_SCREEN/d' BoardConfig.mk
        sed -i '/TARGET_RECOVERY_PIXEL_FORMAT/d' BoardConfig.mk
        sed -i '/TW_EXCLUDE_DEFAULT_USB_INIT/d' BoardConfig.mk
        sed -i '/TW_ROTATION/d' BoardConfig.mk

        # Конфигурация
        cat << "CFG" >> BoardConfig.mk

        # Working Display Config
        TW_ROTATION := 180
        TW_THEME := portrait_hdpi
        TARGET_SCREEN_WIDTH := 1200
        TARGET_SCREEN_HEIGHT := 2000
        TARGET_SCREEN_DENSITY := 280
        TARGET_RECOVERY_PIXEL_FORMAT := "RGBX_8888"
        TW_GRAPHICS_FORCE_USE_LINELENGTH := true
        RECOVERY_GRAPHICS_USE_HEADER_SCALING := true

        # Android 16 Modules Support
        TW_LOAD_VENDOR_BOOT_MODULES := true
        BOARD_VENDOR_BOOT_RECOVERY_LOAD_MODULES := true
        TW_SUPPORT_INPUT_AIDL := true

        # ADB ConfigFS
        TW_EXCLUDE_DEFAULT_USB_INIT := false
        ADDITIONAL_DEFAULT_PROPERTIES += ro.adb.secure=0
        ADDITIONAL_DEFAULT_PROPERTIES += ro.debuggable=1
        ADDITIONAL_DEFAULT_PROPERTIES += sys.usb.config=adb,mtp
        ADDITIONAL_DEFAULT_PROPERTIES += sys.usb.controller=11280000.usb
        CFG

        # Автозагрузка вытянутых модулей при старте
        cat << "RC" > recovery/root/init.recovery.yunluo.rc
        on init
            exec u:r:modprobe:s0 -- /system/bin/sh -c "for m in /vendor/lib/modules/*.ko /lib/modules/*.ko; do insmod \$m; done"

        on boot
            exec u:r:modprobe:s0 -- /system/bin/sh -c "for m in /vendor/lib/modules/*.ko /lib/modules/*.ko; do insmod \$m; done"
        RC

    - name: Compile TWRP
      run: |
        cd twrp_12.1
        export ALLOW_MISSING_DEPENDENCIES=true

        find device/xiaomi/yunluo -type f -name "*.mk" -exec sed -i 's/$(call inherit-product,/$(call inherit-product-if-exists,/g' {} +

        mkdir -p device/mediatek/sepolicy_vndr
        touch device/mediatek/sepolicy_vndr/SEPolicy.mk
        sed -i 's/^include device\/mediatek/-include device\/mediatek/g' device/xiaomi/yunluo/BoardConfig.mk
        sed -i 's/^include vendor\/xiaomi/-include vendor\/xiaomi/g' device/xiaomi/yunluo/BoardConfig.mk

        source build/envsetup.sh
        lunch lineage_yunluo-eng || lunch lineage_yunluo-userdebug
        
        mka recoveryimage bootimage vendorbootimage -j$(nproc --all)

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TWRP-Yunluo-LineageOS23-Modules
        path: twrp_12.1/out/target/product/yunluo/*.img
