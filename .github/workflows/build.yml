name: Build TWRP Recovery for Yunluo
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3

      - name: Install Repo Tool & Make
        run: |
          mkdir ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize TWRP Source
        run: |
          mkdir ~/twrp
          cd ~/twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b twrp-14.1
          repo sync -j$(nproc --all)

      - name: Copy Device Tree
        run: |
          cp -r $GITHUB_WORKSPACE/device ~/twrp/device/xiaomi/yunluo
          cp -r $GITHUB_WORKSPACE/recovery ~/twrp/device/xiaomi/yunluo/recovery

      - name: Build TWRP
        run: |
          cd ~/twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          lunch twrp_yunluo-eng
          mka recoveryimage

      - name: Upload TWRP Image
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Recovery-Image
          path: ~/twrp/out/target/product/yunluo/recovery.img
