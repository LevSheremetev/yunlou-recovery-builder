name: Build TWRP Recovery for Yunluo
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Add Swap Space
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo dd if=/dev/zero of=/swapfile bs=1M count=16384 status=progress
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install Repo Tool & Make
        run: |
          mkdir ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          sudo ln -sf ~/bin/repo /usr/bin/repo

      - name: Initialize TWRP Source
        run: |
          mkdir ~/twrp
          cd ~/twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-12.1
          repo sync -c -j4 --no-clone-bundle --no-tags

      - name: Patch TWRP rsync (multiple attempts)
        run: |
          cd ~/twrp
          FILE=bootable/recovery/prebuilt/Android.mk
          echo "=== Original rsync lines ==="
          grep -n "rsync" $FILE || echo "No rsync found"
          # Заменяем ВСЕ вхождения rsync -a на rsync -a --exclude=vendor --exclude=odm
          sed -i 's/rsync -a/rsync -a --exclude=vendor --exclude=odm/g' $FILE
          # Дополнительно заменяем на случай другого синтаксиса
          sed -i 's/rsync \-a/rsync -a --exclude=vendor --exclude=odm/g' $FILE
          echo "=== Patched rsync lines ==="
          grep -n "rsync" $FILE
          echo "=== Verify exclude=vendor ==="
          grep -c "exclude=vendor" $FILE

      - name: Copy Device Tree
        run: |
          rm -rf ~/twrp/device/xiaomi/yunluo
          mkdir -p ~/twrp/device/xiaomi/yunluo
          cp -r $GITHUB_WORKSPACE/device/xiaomi/yunluo/* ~/twrp/device/xiaomi/yunluo/

      - name: Build TWRP
        run: |
          cd ~/twrp
          source build/envsetup.sh
          export ALLOW_MISSING_DEPENDENCIES=true
          export TARGET_PRODUCT=twrp_yunluo
          export TARGET_BUILD_VARIANT=eng
          export TARGET_RELEASE=sc
          mka recoveryimage -j2
          echo "=== BUILD FINISHED ==="
          find ~/twrp/out/target/product/yunluo -maxdepth 2 -name "*.img" -exec ls -la {} + 2>&1

      - name: Upload Images
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Output
          path: |
            ~/twrp/out/target/product/yunluo/*.img
            ~/twrp/out/target/product/yunluo/**/*.img
          if-no-files-found: warn
